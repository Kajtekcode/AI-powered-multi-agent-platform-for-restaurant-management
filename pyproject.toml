[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "restaurant-growth-os"
version = "2.0.0"
description = "Restaurant Growth OS — AI-powered multi-agent platform for restaurant management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "openai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "aiofiles>=23.2",
    "apscheduler>=3.10",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    "structlog>=24.2",
]

[project.scripts]
rgo = "cli:main"
rgo-server = "run:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
